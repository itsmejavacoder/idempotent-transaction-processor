spring:
  application:
    name: idempotent-transaction-processor
  datasource:
    url: jdbc:h2:file:./data/transactiondb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

processor:
  max-retries: 3
  poll-interval-ms: 1000
  max-batch-size: 1000
  scheduling:
    enabled: true

logging:
  level:
    io.github.itsmejavacoder.txprocessor: INFO
